offline:
  dataset_path: data/processed/imitation.jsonl
  # BC checkpoints + normalization stats live here.
  policy_path: outputs/models/bc_policy.pt
  stats_path: outputs/models/bc_stats.json
  tensorboard_dir: outputs/tensorboard
  batch_size: 6144
  learning_rate: 0.0005
  weight_decay: 0.0001
  label_smoothing: 0.0
  hidden_dim: 1536
  hidden_layers: 6
  slot_mlp_layers: 2
  attn_heads: 8
  head_mlp_dim: 512
  dropout: 0.2
  obs_noise_std: 0.015
  epochs: 150
  val_fraction: 0.1
  max_samples: null
  grad_clip_norm: 1.0
  lr_warmup_epochs: 1
  lr_cosine: true
  grad_accum_steps: 2
  use_amp: true
  amp_dtype: bf16
  filters:
    drop_timeouts: true
    drop_errors: true
    min_reward: -2.0
    min_turns: 4
    drop_results:
    - error
    - timeout
  weighting:
    by_result:
      win: 1.5
      draw: 1.0
      loss: 0.75
    by_opponent:
      simple: 1.0
      maxbp: 1.1
      random: 0.9
    reward_scale: 0.05
    clamp:
      min: 0.25
      max: 2.0
  seed: 0
  device: null
  shuffle: true
  log_every: 50
data_fetch:
  out_dir: data/raw/downloaded
  ids_file: data/sources/replays/ids.txt
  urls_file: data/sources/replays/urls.txt
  ids: []
  user: null
  format: gen9doublesou
  limit: 200
  rate: 0.5
  user_agent: 'poke-rl/0.1 (+contact: none)'
  overwrite: false
data_parse:
  raw_dir: data/raw/downloaded
  out_path: data/processed/human_hints.jsonl
  focus_side: p1
imitation_collect:
  n_battles: 400
  server_url: http://localhost:8000
  battle_format: gen9doublesou
  our_team_path: teams/gen9dou_fixed.txt
  opponent_teams_dir: teams
  # Teacher policy for data collection (heuristic or policy).
  teacher_kind: policy
  teacher_path: outputs/models/maskable_ppo_warmstart.zip
  opponents:
  - simple
  - maxbp
  out_path: data/processed/imitation.jsonl
  battle_timeout: 90.0
  rotate_every: null
  max_concurrent_battles: 1
  opponent_concurrency: 1
online:
  battle_format: gen9doublesou
  # Keep PPO MLP dims aligned with offline.hidden_dim/layers for warmstarts.
  policy_hidden_dim: 1536
  policy_hidden_layers: 6
  policy_head_mlp_dim: 512
  server_url: http://localhost:8000
  team_path: teams/gen9dou_fixed.txt
  player_name_prefix: RLAgent
  opponent_name_prefix: SimpleHeuristics
  opponent_kinds:
  - simple
  - maxbp
  # When true, training saves <policy>_vecnorm.pkl and eval must reload it.
  use_vecnormalize: true
  rate_limit_per_second: null
  base_rewards:
    win: 1.0
    loss: -1.0
    faint: 0.1
    team_hp: 0.05
    active_hp: 0.1
    status: 0.05
    side_condition: 0.05
    draw: -0.1
  modes:
    scratch:
      # Scratch PPO has no BC warmstart and uses base rewards unless overridden.
      total_timesteps: 600000
      learning_rate: 0.0002
      n_steps: 2048
      batch_size: 2048
      parallel_battles: 12
      freeze_shared_steps: 75000
      gamma: 0.99
      gae_lambda: 0.95
      vf_coef: 0.5
      load_bc: false
      eval_freq: 9216
      eval_episodes: 8
      checkpoint_freq: 6144
      checkpoint_keep_last: 1
      entropy_coef: 0.01
      entropy_coef_start: 0.02
      entropy_coef_final: 0.006
      entropy_anneal_steps: 150000
      kl_coef_start: 0.01
      kl_coef_final: 0.0
      kl_anneal_steps: 15000
      target_kl: 0.03
      clip_range_vf: 0.2
      tensorboard_dir: outputs/tensorboard/online/scratch
      policy_path: outputs/models/maskable_ppo_scratch.zip
      log_interval: 2048
      console_log_mode: false
      console_log_interval_sec: 5.0
      rewards: {}
    warmstart:
      # Warmstart reuses BC weights and can override rewards.
      total_timesteps: 600000
      learning_rate: 0.0002
      n_steps: 2048
      batch_size: 2048
      parallel_battles: 12
      freeze_shared_steps: 75000
      gamma: 0.99
      gae_lambda: 0.95
      vf_coef: 0.5
      load_bc: true
      bc_checkpoint: outputs/models/bc_policy_best.pt
      eval_freq: 9216
      eval_episodes: 8
      checkpoint_freq: 6144
      checkpoint_keep_last: 1
      entropy_coef: 0.01
      entropy_coef_start: 0.02
      entropy_coef_final: 0.006
      entropy_anneal_steps: 150000
      kl_coef_start: 0.01
      kl_coef_final: 0.0
      kl_anneal_steps: 15000
      target_kl: 0.03
      clip_range_vf: 0.2
      tensorboard_dir: outputs/tensorboard/online/warmstart
      policy_path: outputs/models/maskable_ppo_warmstart.zip
      log_interval: 2048
      console_log_mode: off
      console_log_interval_sec: 5.0
      rewards:
        win: 2.0
        loss: -2.0
        draw: -0.5
  opponent_schedule:
  # Schedule phases consume timesteps in order; final phase gets remainder.
  - timesteps: 100000
    kinds:
    - simple
  - timesteps: null
    kinds:
    - simple
    - maxbp
imitation_batches:
  heuristics_bulk:
    replicas: 64
    concurrency: 8
    seed_start: 0
    out_path_prefix: data/processed/imitation/shards/heuristicsv2
    settings:
      teacher_kind: policy
      teacher_path: outputs/models/maskable_ppo_warmstart.zip
      opponents:
      - simple
      - maxbp
      n_battles: 180
      rotate_every: 5000
      max_concurrent_battles: 1
  curated_pool:
    replicas: 8
    seed_start: 200
    out_path_prefix: data/processed/imitation/shards/curated
    settings:
      teacher_kind: policy
      teacher_path: outputs/models/maskable_ppo_warmstart.zip
      opponents:
      - simple
      - maxbp
      opponent_teams_dir: teams
      our_team_path: teams/gen9dou_fixed.txt
      n_battles: 120
      rotate_every: null
      max_concurrent_battles: 1
evaluation:
  bc_vs_bots:
    episodes: 20
    opponent: simple
    opponent_pool:
    - simple
    - maxbp
    - random
    battle_format: gen9doublesou
    tensorboard_dir: outputs/tensorboard/eval
    output_path: outputs/eval/bc_vs_bots.jsonl
    summary_path: outputs/eval/bc_vs_bots_summary.json
    checkpoint: outputs/models/bc_policy_best.pt
    stats_path: outputs/models/bc_stats_best.json
    our_team_path: teams/gen9dou_fixed.txt
    server_url: http://localhost:8000
    gate_best_on_win_rate: false
    best_metrics_path: outputs/eval/bc_vs_bots_best.json
    best_policy_path: outputs/models/bc_policy_best.pt
    best_stats_path: outputs/models/bc_stats_best.json
  eval_suite:
    episodes: 20
    output_dir: outputs/eval
    opponents: [simple, maxbp, random, mirror]
    server_url: http://localhost:8000
ppo_runs:
- warmstart
- scratch
imitation_merge:
  output_path: data/processed/imitation.jsonl
  sources:
  - data/processed/imitation/shards/heuristics
  - data/processed/imitation/shards/curated
offline_sweeps:
  hidden_dim:
  - 1536
  dropout:
  - 0.2
  learning_rate:
  - 0.0005
  - 0.0003
  label_smoothing:
  - 0.0
  obs_noise_std:
  - 0.015
  - 0.01
online_sweeps:
  modes:
  - warmstart
  - scratch
  learning_rate:
  - 0.0003
  - 0.0002
  entropy_coef:
  - 0.01
  - 0.005
  total_timesteps:
  - 150000
  - 300000
  policy_hidden_dim:
  - 1536
  policy_hidden_layers:
  - 6
  policy_head_mlp_dim:
  - 512
  kl_coef_start:
  - 0.02
  - 0.01
  kl_anneal_steps:
  - 1000
  - 2000
  target_kl:
  - 0.02
  - 0.015
